name: Gemini AI Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    uses: mrjoshida/gemini-review-action/.github/workflows/review.yml@v1
    with:
      prompt-file: .github/gemini-review-prompt.md
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
