[package]
name = "bendr-desktop"
version = "0.1.0"
edition = "2021"
description = "Desktop wrapper for BENDR with native protocol support"
authors = ["Josh Caldwell"]
license = "MIT"

[lib]
name = "bendr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }

# Phase 1: MIDI
midir = "0.10"
# mdns-sd for Bonjour/mDNS discovery
mdns-sd = "0.11"

# Phase 2: OSC (commented out until needed)
# rosc = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.x86_64-pc-windows-msvc.dependencies]
spout2-rs = "0.1.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-metal = "0.3.2"
syphon-core = "0.4.0"
syphon-metal = "0.4.2"
